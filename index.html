<style>
/* style.css : l'apparence de l'appli (mêmes couleurs que la maquette) */

:root {
  --fond: #F2ECE1;
  --carte: #FFFFFF;
  --encre: #1B2430;
  --discret: #5B6572;
  --piste: #E7E2DA;
  --trait: #CFC8BC;
  --separation: #EFE9DF;
  --vert: #1E7B4B;
  --vert-fond: #E1F2E8;
  --vert-texte: #14573A;
  --orange: #E0701A;
  --orange-fond: #FCE9DA;
  --orange-texte: #8A3F00;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fond);
  color: var(--encre);
  font-family: "Inter", system-ui, -apple-system, sans-serif;
}

button, input { font-family: inherit; }
button { cursor: pointer; }

#app {
  max-width: 430px;
  margin: 0 auto;
  padding: 52px 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

h1 {
  margin: 2px 0 0;
  font-family: "Space Grotesk", "Inter", sans-serif;
  font-weight: 600;
  font-size: 30px;
  letter-spacing: -0.5px;
}

h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--discret); }

.mois { font-size: 14px; color: var(--discret); }
header { margin-bottom: 8px; }

.carte {
  background: var(--carte);
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 1px 2px rgba(27, 36, 48, 0.06);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ligne { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.base { align-items: baseline; }

.pastille {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  background: var(--vert-fond);
  color: var(--vert-texte);
}
.pastille.alerte { background: var(--orange-fond); color: var(--orange-texte); }

.gros {
  font-family: "Space Grotesk", "Inter", sans-serif;
  font-weight: 600;
  font-size: 36px;
  letter-spacing: -0.5px;
}
.gros small { font-family: "Inter", sans-serif; font-weight: 400; font-size: 14px; color: var(--discret); letter-spacing: 0; }

.piste { height: 12px; border-radius: 6px; background: var(--piste); overflow: hidden; }
.piste.fine { height: 8px; border-radius: 4px; }
.remplissage { height: 100%; border-radius: inherit; background: var(--vert); }
.remplissage.alerte { background: var(--orange); }

.discret { font-size: 14px; color: var(--discret); }
.petit { font-size: 13px; color: var(--discret); }
.bon { color: var(--vert-texte); font-weight: 600; }
.mauvais { color: var(--orange-texte); font-weight: 600; }

.categorie { display: flex; flex-direction: column; gap: 6px; }
.categorie + .categorie { margin-top: 4px; }
.categorie strong { font-size: 15px; }

/* Saisie */
.saisie { display: flex; gap: 8px; align-items: center; }
.saisie input, .champ input {
  flex: 1;
  min-width: 0;
  height: 48px;
  padding: 0 16px;
  border-radius: 24px;
  border: 1px solid var(--trait);
  background: #fff;
  color: var(--encre);
  font-size: 16px;
}
.rond {
  flex: none;
  width: 48px;
  height: 48px;
  border-radius: 24px;
  border: none;
  background: var(--encre);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.micro {
  width: 88px;
  height: 88px;
  border-radius: 44px;
  border: none;
  background: var(--vert);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(30, 123, 75, 0.28);
  align-self: center;
}
.micro.ecoute { background: var(--orange); box-shadow: 0 8px 20px rgba(224, 112, 26, 0.3); }
.micro[disabled] { background: var(--piste); color: var(--discret); box-shadow: none; cursor: default; }
.centre { text-align: center; }

.lien {
  align-self: flex-start;
  height: 40px;
  padding: 0 4px;
  border: none;
  background: transparent;
  color: var(--encre);
  font-size: 14px;
  font-weight: 600;
  text-decoration: underline;
}

.champ { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--discret); }
.champ input { flex: none; width: 100%; }

.puces { display: flex; flex-wrap: wrap; gap: 8px; }
.puce {
  height: 40px;
  padding: 0 14px;
  border-radius: 20px;
  border: 1px solid var(--trait);
  background: #fff;
  color: var(--encre);
  font-size: 14px;
  font-weight: 500;
}
.puce[aria-pressed="true"] { background: var(--encre); border-color: var(--encre); color: #fff; font-weight: 600; }

.bouton {
  height: 56px;
  border-radius: 28px;
  border: none;
  background: var(--encre);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
}
.bouton.clair { background: #fff; color: var(--encre); border: 1.5px solid var(--encre); height: 48px; font-size: 15px; border-radius: 24px; }

.consequence { padding-top: 12px; border-top: 1px solid var(--separation); display: flex; flex-direction: column; gap: 2px; }

/* Indicateurs */
.grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grille .carte { padding: 16px; gap: 4px; }
.grille h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--discret); }
.chiffre { font-family: "Space Grotesk", "Inter", sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.5px; }

/* Dernières dépenses */
.depense { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; }
.depense + .depense { border-top: 1px solid var(--separation); }
.depense .nom { font-size: 15px; font-weight: 600; }
.montant { font-family: "Space Grotesk", "Inter", sans-serif; font-weight: 600; font-size: 16px; }
.supprimer { border: none; background: transparent; color: var(--discret); font-size: 13px; text-decoration: underline; height: 36px; padding: 0 6px; }

details summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--discret); }
.budgets { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

.message { font-size: 14px; color: var(--orange-texte); font-weight: 600; }
.confirmation { font-size: 14px; color: var(--vert-texte); font-weight: 600; text-align: center; }

/* ---------- Onglet Révision et barre d'onglets ---------- */

#app { padding-bottom: 120px; }

.ligne-bague { flex-direction: row; align-items: center; gap: 18px; }
.bague { position: relative; width: 112px; height: 112px; flex: none; }
.bague-texte {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Space Grotesk", "Inter", sans-serif;
  font-weight: 600;
  font-size: 22px;
}
.bague-infos { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.gros-moyen { font-family: "Space Grotesk", "Inter", sans-serif; font-weight: 600; font-size: 34px; letter-spacing: -0.5px; }

.barres { position: relative; height: 120px; display: flex; align-items: flex-end; justify-content: space-between; }
.repere { position: absolute; left: 0; right: 0; border-top: 2px dashed #8C8478; }
.colonne { width: 40px; display: flex; justify-content: center; }
.colonne > div { width: 28px; }
.jours { display: flex; justify-content: space-between; font-size: 12px; color: var(--discret); }
.jours span { width: 40px; text-align: center; }
.jours .auj { font-weight: 600; color: var(--encre); }

.puces.centree { justify-content: center; }
.duree { display: flex; align-items: center; justify-content: space-between; }
.rond.clair { background: #fff; color: var(--encre); border: 1px solid var(--trait); }

.piste.repere-but { position: relative; overflow: visible; }
.but { position: absolute; top: -3px; width: 2px; height: 14px; border-radius: 1px; background: var(--encre); }

.colonne-droite { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.separe { padding-top: 12px; border-top: 1px solid var(--separation); }
.avec-icone { display: flex; align-items: center; justify-content: center; gap: 10px; }
.reglage { align-items: flex-end; }

.carte .consequence .puces,
.carte .consequence .champ,
.carte .consequence .bouton,
.carte .consequence .message { margin-top: 10px; }

.barre {
  position: fixed;
  left: 50%;

<body>
<main id="app"></main>
<script>
// calc.js : tout le calcul de l'appli, sans rien afficher à l'écran.
// Convention de signe : un écart POSITIF est toujours bon (il me reste de la marge),
// un écart NÉGATIF veut dire que je dépasse mon budget.

const CATEGORIES = ["Courses", "Transport", "Loisirs", "Autres"];
const DEFAULT_BUDGETS = { Courses: 120, Transport: 40, Loisirs: 100, Autres: 40 };

// Mots-clés qui permettent de deviner la catégorie (écrits sans accents).
const KEYWORDS = {
  Courses: ["courses", "supermarche", "carrefour", "lidl", "auchan", "leclerc", "intermarche", "monoprix", "boulangerie", "epicerie", "nourriture"],
  Transport: ["bus", "tram", "metro", "train", "sncf", "essence", "carburant", "uber", "taxi", "trottinette", "navigo", "parking"],
  Loisirs: ["cine", "cinema", "resto", "restos", "restaurant", "bar", "kebab", "cafe", "soiree", "sortie", "netflix", "spotify", "concert", "jeu", "burger", "pizza"],
};

const WEEKDAYS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const IGNORED_WORDS = ["de", "du", "des", "pour", "en", "au", "aux", "le", "la", "les", "un", "une", "j'ai", "depense", "euro", "euros", "eur", "hier", "avant-hier", "aujourd'hui", "aujourdhui", "ce", "matin", "soir", "et", "a"];

function pad(n) {
  return String(n).padStart(2, "0");
}

function toIso(date) {
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
}

function fromIso(text) {
  const [y, m, d] = text.split("-").map(Number);
  return new Date(y, m - 1, d);
}

// Met en minuscules et enlève les accents, pour comparer des mots facilement.
function normalize(text) {
  return text
    .toLowerCase()
    .replace(/[’‘]/g, "'")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}


// Transforme les nombres dictés en lettres en chiffres : « cinq euros cinquante » devient « 5 euros 50 ».
const NUMBER_WORDS = {
  zero: 0, un: 1, une: 1, deux: 2, trois: 3, quatre: 4, cinq: 5, six: 6, sept: 7, huit: 8, neuf: 9, dix: 10,
  onze: 11, douze: 12, treize: 13, quatorze: 14, quinze: 15, seize: 16, vingt: 20, vingts: 20, trente: 30,
  quarante: 40, cinquante: 50, soixante: 60, cent: 100, cents: 100, mille: 1000,
};

function numberWordsToDigits(text) {
  const tokens = text.split(/(\s+|-)/); // on garde les séparateurs pour ne rien perdre
  const isEuro = (t) => t && /^(euros?|eur|€|balles?)$/.test(normalize(t));
  const out = [];
  let i = 0;
  while (i < tokens.length) {
    const word = normalize(tokens[i]).replace(/[^a-z]/g, "");
    if (!(word in NUMBER_WORDS) || tokens[i] === "") {
      out.push(tokens[i]);
      i++;
      continue;
    }
    // On lit toute la suite de mots-nombres (avec « et » et les tirets entre eux)
    let j = i;
    const run = [];
    while (j < tokens.length) {
      const w = normalize(tokens[j]).replace(/[^a-z]/g, "");
      if (w in NUMBER_WORDS) run.push(w);
      else if (/^(\s+|-)$/.test(tokens[j]) || w === "et") {
        // séparateur ou « et » : on continue seulement si un autre mot-nombre suit
        let k = j + 1;
        while (k < tokens.length && (/^(\s+|-)$/.test(tokens[k]) || normalize(tokens[k]) === "et")) k++;
        const next = k < tokens.length ? normalize(tokens[k]).replace(/[^a-z]/g, "") : "";
        if (!(next in NUMBER_WORDS) || tokens[k] === "") break;
        j = k - 1;
      } else break;
      j++;
    }
    // « un » / « une » tout seul est un article (« un kebab »), sauf devant « euro »
    let nextWord = j;
    while (nextWord < tokens.length && /^\s+$/.test(tokens[nextWord])) nextWord++;
    if (run.length === 1 && (run[0] === "un" || run[0] === "une") && !isEuro(tokens[nextWord])) {
      out.push(tokens[i]);
      i++;
      continue;
    }
    let total = 0;
    let current = 0;
    let previous = "";
    run.forEach((w) => {
      const value = NUMBER_WORDS[w];
      if (value === 1000) {
        total += (current || 1) * 1000;
        current = 0;
      } else if (value === 100) current = (current || 1) * 100;
      else if (value === 20 && previous === "quatre") current = current - 4 + 80;
      else current += value;
      previous = w;
    });
    out.push(String(total + current));
    i = j;
  }
  // « douze virgule cinq » devient « 12,5 »
  return out.join("").replace(/(\d)\s+virgule\s+(\d)/gi, "$1,$2");
}

// Lit une phrase comme « 12 euros courses hier » et en tire le montant, la catégorie et la date.
function parseExpense(text, today = new Date()) {
  text = numberWordsToDigits(text);
  const clean = normalize(text);

  // 1. Le montant
  let amount = null;
  let match = clean.match(/(\d+)\s*(?:€|euros?|eur)\s*(\d{1,2})\b/); // « 12 euros 50 »
  if (match) {
    amount = Number(match[1]) + Number(match[2]) / (match[2].length === 1 ? 10 : 100);
  } else {
    match = clean.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|euros?|eur)/); // « 12,5 € »
    if (!match) match = clean.match(/(\d+(?:[.,]\d{1,2})?)/); // à défaut, le premier nombre
    if (match) amount = parseFloat(match[1].replace(",", "."));
  }

  // 2. La catégorie (« Autres » si aucun mot-clé ne correspond)
  const words = clean.split(/[^a-z0-9']+/);
  let category = "Autres";
  for (const name of Object.keys(KEYWORDS)) {
    if (words.some((word) => KEYWORDS[name].includes(word))) {
      category = name;
      break;
    }
  }

  // 3. La date (aujourd'hui par défaut)
  let daysBack = 0;
  if (/avant[- ]hier/.test(clean)) {
    daysBack = 2;
  } else if (/\bhier\b/.test(clean)) {
    daysBack = 1;
  } else {
    const dayName = WEEKDAYS.find((name) => words.includes(name));
    if (dayName) daysBack = (today.getDay() - WEEKDAYS.indexOf(dayName) + 7) % 7;
  }
  const date = new Date(today.getFullYear(), today.getMonth(), today.getDate() - daysBack);

  // 4. Une courte description : les mots de la phrase qui ne sont ni un nombre, ni une date, ni un mot vide
  const skip = new Set([...IGNORED_WORDS, ...WEEKDAYS]);
  const note = text
    .split(/\s+/)
    .filter((word) => {
      const w = normalize(word).replace(/[^a-z0-9'-]/g, "");
      return w && !/^\d/.test(w) && !skip.has(w) && w !== "€";
    })
    .join(" ");

  return {
    amount,
    category,
    date: toIso(date),
    note: note.charAt(0).toUpperCase() + note.slice(1),
  };
}

function sum(numbers) {
  return numbers.reduce((total, n) => total + n, 0);
}

// Calcule tous les indicateurs du mois en cours.
function indicators(budgets, expenses, today = new Date()) {
  const monthKey = today.getFullYear() + "-" + pad(today.getMonth() + 1);
  const month = expenses.filter((e) => e.date.slice(0, 7) === monthKey && e.date <= toIso(today));
  const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  const day = today.getDate();
  const daysLeft = daysInMonth - day + 1; // aujourd'hui compris

  const budget = sum(CATEGORIES.map((c) => budgets[c] || 0));
  const spent = sum(month.map((e) => e.amount));
  const rest = budget - spent;
  const averagePerDay = spent / day;
  const projection = averagePerDay * daysInMonth;

  const categories = CATEGORIES.map((name) => {
    const categorySpent = sum(month.filter((e) => e.category === name).map((e) => e.amount));
    const categoryBudget = budgets[name] || 0;
    return {
      name,
      spent: categorySpent,
      budget: categoryBudget,
      gap: categoryBudget - categorySpent,
      percent: categoryBudget > 0 ? (categorySpent / categoryBudget) * 100 : 0,
    };
  });

  const daysWithSpending = new Set(month.map((e) => e.date)).size;
  const topCategory = spent > 0 ? categories.reduce((a, b) => (b.spent > a.spent ? b : a)) : null;

  return {
    budget,
    spent,
    rest,
    daysInMonth,
    day,
    daysLeft,
    averagePerDay,
    restPerDay: rest / daysLeft,
    budgetPerDay: budget / daysInMonth,
    projection,
    margin: budget - projection,
    onTrack: projection <= budget,
    percentBudget: budget > 0 ? (spent / budget) * 100 : 0,
    percentMonth: (day / daysInMonth) * 100,
    daysWithoutSpending: day - daysWithSpending,
    daysAffordable: averagePerDay > 0 ? rest / averagePerDay : null,
    topCategory: topCategory ? { name: topCategory.name, share: (topCategory.spent / spent) * 100 } : null,
    categories,
  };
}

/* ---------- Révision ---------- */

// Réglages de départ : un minimum par jour et un temps prévu par cours sur 7 jours (en minutes).
const DEFAULT_REVISION = {
  dailyMin: 90,
  courses: [
    { name: "Contrôle de gestion", goal: 180 },
    { name: "Droit", goal: 150 },
    { name: "Anglais", goal: 120 },
    { name: "Marketing", goal: 120 },
    { name: "Statistiques", goal: 120 },
  ],
  sessions: [], // { id, course, minutes, date }
  exams: [], // { id, course, date }
};

function addDays(date, n) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n);
}

// 65 -> « 1 h 05 », 90 -> « 1 h 30 », 45 -> « 45 min », 120 -> « 2 h »
function duration(minutes) {
  const total = Math.round(minutes);
  const hours = Math.floor(total / 60);
  const rest = total % 60;
  if (hours === 0) return rest + " min";
  if (rest === 0) return hours + " h";
  return hours + " h " + pad(rest);
}

// Statistiques « minutes par jour contre un minimum », communes à la révision et à la lecture.
function dailyStats(sessions, dailyMin, today) {
  const minutesOn = (iso) => sum(sessions.filter((s) => s.date === iso).map((s) => s.minutes));

  // Les 7 derniers jours, aujourd'hui compris
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const date = addDays(today, -i);
    const minutes = minutesOn(toIso(date));
    days.push({ iso: toIso(date), weekday: date.getDay(), minutes, reached: minutes >= dailyMin, isToday: i === 0 });
  }
  const finishedDays = days.filter((d) => !d.isToday);
  const todayMinutes = days[6].minutes;

  // Série : jours de suite où le minimum est atteint. Aujourd'hui compte seulement s'il est déjà atteint.
  let streak = days[6].reached ? 1 : 0;
  for (let i = 1; i < 3650 && minutesOn(toIso(addDays(today, -i))) >= dailyMin; i++) streak++;

  return {
    todayMinutes,
    days,
    finishedDays,
    daysFinished: finishedDays.length,
    average7: sum(days.map((d) => d.minutes)) / 7,
    daysReached: finishedDays.filter((d) => d.reached).length,
    streak,
    percentToday: dailyMin > 0 ? (todayMinutes / dailyMin) * 100 : 0,
    remainingToday: Math.max(0, dailyMin - todayMinutes),
  };
}

// Calcule tous les indicateurs de révision à partir des sessions notées.
function revisionIndicators(data, today = new Date()) {
  const todayIso = toIso(today);
  const dailyMin = data.dailyMin;
  const { todayMinutes, days, finishedDays, average7, daysReached, streak } = dailyStats(data.sessions, dailyMin, today);

  // Par cours, sur les 7 derniers jours
  const weekStart = days[0].iso;
  const week = data.sessions.filter((s) => s.date >= weekStart && s.date <= todayIso);
  const weekTotal = sum(week.map((s) => s.minutes));
  const courses = data.courses.map((course) => {
    const done = sum(week.filter((s) => s.course === course.name).map((s) => s.minutes));
    return {
      name: course.name,
      done,
      goal: course.goal,
      gap: done - course.goal, // positif = j'ai fait plus que prévu
      delay: Math.max(0, course.goal - done),
      share: weekTotal > 0 ? (done / weekTotal) * 100 : 0,
    };
  });
  const byName = Object.fromEntries(courses.map((c) => [c.name, c]));

  // DS à venir : classés par date la plus proche, puis par retard le plus grand
  const exams = data.exams
    .filter((e) => e.date >= todayIso)
    .map((e) => {
      const delay = byName[e.course] ? byName[e.course].delay : 0;
      const daysLeft = Math.round((fromIso(e.date) - fromIso(todayIso)) / 86400000);
      return { id: e.id, course: e.course, date: e.date, daysLeft, delay, perDay: delay / Math.max(1, daysLeft) };
    })
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : b.delay - a.delay));

  return {
    dailyMin,
    todayMinutes,
    percentToday: dailyMin > 0 ? (todayMinutes / dailyMin) * 100 : 0,
    remainingToday: Math.max(0, dailyMin - todayMinutes),
    days,
    average7,
    daysReached,
    daysFinished: finishedDays.length,
    streak,
    weekStart,
    weekTotal,
    courses,
    exams,
  };
}

/* ---------- Lecture ---------- */

// Un minimum de lecture par jour, une bibliothèque et les sessions notées.
const DEFAULT_READING = {
  dailyMin: 30,
  books: [], // { id, title, pages, page, status: "reading" ou "done" }
  sessions: [], // { id, bookId, minutes, date, pages } (pages = pages lues pendant la session, si connues)
};

function readingIndicators(data, today = new Date()) {
  const todayIso = toIso(today);
  const dailyMin = data.dailyMin;
  const stats = dailyStats(data.sessions, dailyMin, today);

  // Lu ce mois-ci, comparé au minimum des jours écoulés
  const monthKey = todayIso.slice(0, 7);
  const monthMinutes = sum(data.sessions.filter((s) => s.date.slice(0, 7) === monthKey && s.date <= todayIso).map((s) => s.minutes));
  const monthAboveMinimum = monthMinutes - dailyMin * today.getDate();

  // Meilleure série de tous les temps
  const perDay = {};
  data.sessions.forEach((s) => {
    perDay[s.date] = (perDay[s.date] || 0) + s.minutes;
  });
  const dates = Object.keys(perDay).sort();
  let bestStreak = 0;
  let run = 0;
  if (dates.length) {
    for (let d = fromIso(dates[0]); toIso(d) <= todayIso; d = addDays(d, 1)) {
      if ((perDay[toIso(d)] || 0) >= dailyMin) {
        run++;
        bestStreak = Math.max(bestStreak, run);
      } else run = 0;
    }
  }

  // Vitesse de lecture : pages lues ÷ heures, sur les sessions où la page atteinte a été notée
  const timed = data.sessions.filter((s) => s.pages > 0);
  const timedMinutes = sum(timed.map((s) => s.minutes));
  const speed = timedMinutes > 0 ? (sum(timed.map((s) => s.pages)) / timedMinutes) * 60 : null; // pages par heure

  // Pour chaque livre : progression, temps restant et nombre de jours pour le finir
  const books = data.books.map((book) => {
    const pagesLeft = Math.max(0, book.pages - book.page);
    const timeLeft = speed ? (pagesLeft / speed) * 60 : null;
    return {
      ...book,
      percent: book.pages > 0 ? (book.page / book.pages) * 100 : 0,
      pagesLeft,
      timeLeft,
      daysToFinish: timeLeft !== null && stats.average7 > 0 ? Math.ceil(timeLeft / stats.average7) : null,
    };
  });

  return {
    ...stats,
    dailyMin,
    monthMinutes,
    monthAboveMinimum,
    bestStreak,
    speed,
    books,
    booksRead: books.filter((b) => b.status === "done").length,
  };
}


// Google Agenda : transforme les événements en DS. Un événement est un DS s'il est en rouge tomate (colorId 11)
// ou si son titre contient DS, contrôle, partiel, examen ou évaluation.
function plain(text) {
  return String(text || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function examsFromEvents(events, courses) {
  const looksLikeExam = /\b(ds|controle|partiel|examen|evaluation)\b/;
  return (events || [])
    .filter((e) => e.status !== "cancelled" && e.start && (e.colorId === "11" || looksLikeExam.test(plain(e.summary))))
    .map((e) => {
      const title = plain(e.summary);
      const match = courses.find((c) => title.includes(plain(c.name)));
      return {
        id: "g" + e.id,
        gcalId: e.id,
        course: match ? match.name : String(e.summary || "DS").trim(),
        date: (e.start.date || e.start.dateTime || "").slice(0, 10),
      };
    })
    .filter((e) => e.date);
}

const CG = { CATEGORIES, DEFAULT_BUDGETS, DEFAULT_REVISION, DEFAULT_READING, parseExpense, indicators, revisionIndicators, readingIndicators, examsFromEvents, duration, addDays, toIso, fromIso };
if (typeof module !== "undefined") module.exports = CG;

// revision.js : l'onglet Révision (ce qui s'affiche et ce que font les boutons).
// Le calcul est dans calc.js ; les outils communs (state, esc, read, write, render) sont dans app.js.

const QUICK_MINUTES = [15, 30, 45, 60, 90];
const WEEKDAY_SHORT = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];

function loadRevision() {
  const fresh = JSON.parse(JSON.stringify(CG.DEFAULT_REVISION));
  return Object.assign(fresh, read(STORE.revision, {}));
}

function saveRevision() {
  write(STORE.revision, state.revision);
}

function longDate(iso) {
  const text = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" }).format(CG.fromIso(iso));
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function inDays(n) {
  return n === 0 ? "aujourd'hui" : n === 1 ? "demain" : "dans " + n + " jours";
}

function signedDuration(minutes) {
  if (minutes === 0) return "atteint";
  return (minutes > 0 ? "+" : "−") + CG.duration(Math.abs(minutes));
}

// Prépare le formulaire « Noter ma session » et celui « Ajouter un DS » s'ils n'existent pas encore.
function ensureForms(today) {
  const first = state.revision.courses.length ? state.revision.courses[0].name : "";
  if (!state.log) state.log = { course: first, minutes: 30, date: CG.toIso(today) };
  if (!state.examDraft) state.examDraft = { course: first, date: "" };
  const names = state.revision.courses.map((c) => c.name);
  if (!names.includes(state.log.course)) state.log.course = first;
  if (!names.includes(state.examDraft.course)) state.examDraft.course = first;
}

/* ---------- Les blocs de l'écran ---------- */

function revisionView(today) {
  const data = state.revision;
  const k = CG.revisionIndicators(data, today);
  ensureForms(today);
  return [revisionHeader(today), todayBlock(k), weekBlock(k), logBlock(k, today), coursesBlock(k), examsBlock(k, today), revisionSettings(data)].join("");
}

function revisionHeader(today) {
  return `<header><div class="mois">${esc(longDate(CG.toIso(today)))}</div><h1>Révision</h1></header>`;
}

function todayBlock(k, subject = "révision") {
  const percent = Math.round(k.percentToday);
  const dash = (Math.min(100, k.percentToday) / 100) * 289.03;
  const pill = k.remainingToday === 0 ? "Objectif atteint" : "Encore " + CG.duration(k.remainingToday);
  return `
  <section class="carte ligne-bague">
    <div class="bague" role="img" aria-label="${percent} % du temps de ${subject} minimum atteint aujourd'hui">
      <svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true">
        <circle cx="56" cy="56" r="46" fill="none" stroke="#E7E2DA" stroke-width="12"></circle>
        ${dash > 0 ? `<circle cx="56" cy="56" r="46" fill="none" stroke="#1E7B4B" stroke-width="12" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} 289.03" transform="rotate(-90 56 56)"></circle>` : ""}
      </svg>
      <div class="bague-texte">${percent} %</div>
    </div>
    <div class="bague-infos">
      <h2>Aujourd'hui</h2>
      <div class="gros-moyen">${CG.duration(k.todayMinutes)}</div>
      <div class="discret">Minimum ${CG.duration(k.dailyMin)} par jour</div>
      <span class="pastille" style="align-self:flex-start">${pill}</span>
    </div>
  </section>`;
}

function weekBlock(k, subject = "révision") {
  const scale = 0.8; // pixels par minute
  const line = Math.min(112, k.dailyMin * scale);
  const bars = k.days
    .map((d) => {
      let style;
      if (d.minutes === 0) style = "height:3px;border-radius:2px;background:var(--piste)";
      else {
        const height = Math.max(6, Math.min(112, d.minutes * scale));
        if (d.isToday) style = `height:${height}px;border-radius:10px 10px 4px 4px;background:var(--vert-fond);border:2px solid var(--vert)`;
        else style = `height:${height}px;border-radius:10px 10px 4px 4px;background:${d.reached ? "var(--vert)" : "var(--orange)"}`;
      }
      return `<div class="colonne"><div style="${style}"></div></div>`;
    })
    .join("");
  const labels = k.days.map((d) => `<span class="${d.isToday ? "auj" : ""}">${WEEKDAY_SHORT[d.weekday]}</span>`).join("");
  const spoken = k.days.map((d) => `${WEEKDAY_SHORT[d.weekday]} ${CG.duration(d.minutes)}`).join(", ");
  const streakText = k.streak > 0 ? `Série en cours : ${k.streak} jour${k.streak > 1 ? "s" : ""} de suite.` : "Pas de série en cours.";
  return `
  <section class="carte">
    <div class="ligne base"><h2>7 derniers jours</h2><span class="petit">Moyenne ${CG.duration(k.average7)}</span></div>
    <div class="barres" role="img" aria-label="Temps de ${subject} des 7 derniers jours : ${spoken}. Minimum : ${CG.duration(k.dailyMin)}.">
      <div class="repere" style="bottom:${line}px"></div>${bars}
    </div>
    <div class="jours" aria-hidden="true">${labels}</div>
    <div class="petit">La ligne pointillée marque ton minimum de ${CG.duration(k.dailyMin)}. Aujourd'hui (contour) n'est pas encore fini. ${k.daysReached} jour${k.daysReached > 1 ? "s" : ""} réussi${k.daysReached > 1 ? "s" : ""} sur ${k.daysFinished}. ${streakText}</div>
  </section>`;
}

function logBlock(k, today) {
  const data = state.revision;
  const log = state.log;
  if (!data.courses.length) {
    return `<section class="carte"><h2>Noter ma session</h2><div class="petit">Ajoute d'abord un cours dans « Mes cours et objectifs » en bas de la page.</div></section>`;
  }
  const chips = data.courses.map((c) => `<button type="button" class="puce" data-action="logcourse" data-course="${esc(c.name)}" aria-pressed="${log.course === c.name}">${esc(c.name)}</button>`).join("");
  const quick = QUICK_MINUTES.map((m) => `<button type="button" class="puce petite" data-action="setmin" data-value="${m}" aria-pressed="${log.minutes === m}">${CG.duration(m)}</button>`).join("");
  const todayIso = CG.toIso(today);
  const course = k.courses.find((c) => c.name === log.course);
  let lines = "";
  if (log.date === todayIso) {
    const after = k.todayMinutes + log.minutes;
    const reached = after >= data.dailyMin;
    lines += `<div class="${reached ? "bon" : "petit"}">Avec cette session : ${CG.duration(after)} aujourd'hui, ${reached ? "objectif atteint." : "encore " + CG.duration(data.dailyMin - after) + "."}</div>`;
  }
  if (course && log.date >= k.weekStart && log.date <= todayIso) {
    lines += `<div class="petit">${esc(course.name)} : ${CG.duration(course.done + log.minutes)} sur 7 jours, sur ${CG.duration(course.goal)} prévues.</div>`;
  }
  return `
  <section class="carte">
    <h2>Noter ma session</h2>
    <div class="puces" role="group" aria-label="Cours">${chips}</div>
    <div class="duree">
      <button type="button" class="rond clair" data-action="min" data-delta="-5" aria-label="Retirer 5 minutes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
      <div class="gros-moyen">${CG.duration(log.minutes)}</div>
      <button type="button" class="rond" data-action="min" data-delta="5" aria-label="Ajouter 5 minutes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <div class="puces centree" role="group" aria-label="Durées rapides">${quick}</div>
    <label class="champ">Date<input id="l-date" type="date" max="${todayIso}" value="${esc(log.date)}"></label>
    ${lines ? `<div class="consequence">${lines}</div>` : ""}
    ${state.revMessage ? `<div class="message">${esc(state.revMessage)}</div>` : ""}
    <button type="button" class="bouton" data-action="savesession">Enregistrer</button>
    ${state.revConfirmation ? `<div class="confirmation">${esc(state.revConfirmation)}</div>` : ""}
  </section>`;
}

function coursesBlock(k) {
  if (!k.courses.length) return "";
  const rows = k.courses
    .map((c) => {
      const scale = Math.max(c.goal, c.done, 1) * 1.1;
      const ok = c.done >= c.goal;
      return `
      <div class="categorie">
        <div class="ligne base"><strong>${esc(c.name)}</strong><span class="petit">${CG.duration(c.done)} / ${CG.duration(c.goal)} · <span class="${ok ? "bon" : "mauvais"}">${signedDuration(c.gap)}</span></span></div>
        <div class="piste fine repere-but" role="img" aria-label="${esc(c.name)} : ${CG.duration(c.done)} révisées, objectif de ${CG.duration(c.goal)} ${ok ? "atteint" : "pas encore atteint"}">
          <div class="remplissage ${ok ? "" : "alerte"}" style="width:${Math.min(100, (c.done / scale) * 100).toFixed(1)}%"></div>
          <div class="but" style="left:${((c.goal / scale) * 100).toFixed(1)}%"></div>
        </div>
      </div>`;
    })
    .join("");
  return `<section class="carte"><div class="ligne base"><h2>Par cours, 7 derniers jours</h2><span class="petit">Total ${CG.duration(k.weekTotal)}</span></div>${rows}</section>`;
}

const calendarIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>`;

function examsBlock(k, today) {
  const data = state.revision;
  const draft = state.examDraft;
  const rows = k.exams.length
    ? k.exams
        .map((e) => {
          const late = e.delay > 0;
          return `
        <div class="depense">
          <div>
            <div class="nom">${esc(e.course)}</div>
            <div class="petit">${esc(longDate(e.date))} · ${inDays(e.daysLeft)}</div>
            ${late ? `<div class="petit">Soit ${CG.duration(Math.ceil(e.perDay))} de plus par jour</div>` : ""}
          </div>
          <div class="colonne-droite">
            <span class="pastille ${late ? "alerte" : ""}">${late ? CG.duration(e.delay) + " de retard" : "À jour"}</span>
            <button type="button" class="supprimer" data-action="delexam" data-id="${e.id}" aria-label="Supprimer ce DS">Supprimer</button>
          </div>
        </div>`;
        })
        .join("")
    : `<div class="petit">Aucun DS à venir. Ajoute-en un ci-dessous.</div>`;
  const chips = data.courses.map((c) => `<button type="button" class="puce" data-action="examcourse" data-course="${esc(c.name)}" aria-pressed="${draft.course === c.name}">${esc(c.name)}</button>`).join("");
  const form = data.courses.length
    ? `
    <div class="consequence">
      <h2>Ajouter un DS</h2>
      <div class="puces" role="group" aria-label="Cours du DS">${chips}</div>
      <label class="champ">Date du DS<input id="x-date" type="date" min="${CG.toIso(today)}" value="${esc(draft.date)}"></label>
      <button type="button" class="bouton clair" data-action="addexam">Ajouter ce DS</button>
      ${state.examMessage ? `<div class="message">${esc(state.examMessage)}</div>` : ""}
    </div>`
    : "";
  return `
  <section class="carte">
    <button type="button" class="bouton clair avec-icone" data-action="gcal">${calendarIcon} Lier mon Google Agenda</button>
    <div class="petit centre">${state.gcalMessage ? esc(state.gcalMessage) : "Lecture seule. Tes DS classent les cours à réviser en priorité."}</div>
    <div class="ligne base separe"><h2>DS à venir</h2><span class="petit">Priorité : date et retard</span></div>
    ${rows}
    ${form}
  </section>`;
}

function revisionSettings(data) {
  const courses = data.courses
    .map(
      (c) => `
    <div class="ligne reglage">
      <label class="champ" style="flex:1">${esc(c.name)} (minutes sur 7 jours)<input type="text" inputmode="numeric" data-rev-goal="${esc(c.name)}" value="${c.goal}"></label>
      <button type="button" class="supprimer" data-action="delcourse" data-name="${esc(c.name)}" aria-label="Supprimer le cours ${esc(c.name)}">Supprimer</button>
    </div>`
    )
    .join("");
  return `
  <section class="carte">
    <details ${state.settingsOpen ? "open" : ""}><summary>Mes cours et objectifs</summary>
      <div class="budgets">
        <label class="champ">Minimum par jour (en minutes)<input type="text" inputmode="numeric" data-rev="daily" value="${data.dailyMin}"></label>
        ${courses}
        ${gcalSettings()}
        <div class="saisie">
          <input id="new-course" type="text" aria-label="Nom du nouveau cours" placeholder="Nouveau cours" autocomplete="off">
          <button type="button" class="rond" data-action="addcourse" aria-label="Ajouter ce cours"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        </div>
      </div>
    </details>
  </section>`;
}

/* ---------- Ce que font les boutons ---------- */

// Recopie les dates tapées avant de redessiner l'écran.
function syncRevisionForms() {
  const logDate = document.getElementById("l-date");
  const examDate = document.getElementById("x-date");
  if (logDate && state.log) state.log.date = logDate.value;
  if (examDate && state.examDraft) state.examDraft.date = examDate.value;
}

function clearRevisionMessages() {
  state.revMessage = "";
  state.revConfirmation = "";
  state.examMessage = "";
  state.gcalMessage = "";
}

// Renvoie true si l'action concerne la révision (et a été traitée).
function revisionClick(action, button) {
  const actions = ["logcourse", "min", "setmin", "savesession", "gcal", "examcourse", "addexam", "delexam", "addcourse", "delcourse"];
  if (!actions.includes(action)) return false;
  syncRevisionForms();
  clearRevisionMessages();
  const data = state.revision;

  if (action === "logcourse") state.log.course = button.dataset.course;
  else if (action === "min") state.log.minutes = Math.min(600, Math.max(5, state.log.minutes + Number(button.dataset.delta)));
  else if (action === "setmin") state.log.minutes = Number(button.dataset.value);
  else if (action === "examcourse") state.examDraft.course = button.dataset.course;
  else if (action === "gcal") {
    syncGoogleCalendar(); // défini dans gcal.js
  } else if (action === "savesession") {
    if (!state.log.course) state.revMessage = "Choisis un cours.";
    else if (!state.log.date) state.revMessage = "Choisis une date.";
    else {
      data.sessions.push({ id: Date.now(), course: state.log.course, minutes: state.log.minutes, date: state.log.date });
      saveRevision();
      state.revConfirmation = "Session enregistrée.";
    }
  } else if (action === "addexam") {
    if (!state.examDraft.course) state.examMessage = "Choisis un cours.";
    else if (!state.examDraft.date) state.examMessage = "Choisis la date du DS.";
    else {
      data.exams.push({ id: Date.now(), course: state.examDraft.course, date: state.examDraft.date });
      saveRevision();
      state.examDraft.date = "";
    }
  } else if (action === "delexam") {
    if (window.confirm("Supprimer ce DS ?")) {
      data.exams = data.exams.filter((e) => String(e.id) !== button.dataset.id);
      saveRevision();
    }
  } else if (action === "addcourse") {
    const field = document.getElementById("new-course");
    const name = field ? field.value.trim() : "";
    if (name && !data.courses.some((c) => c.name.toLowerCase() === name.toLowerCase())) {
      data.courses.push({ name, goal: 120 });
      saveRevision();
    }
  } else if (action === "delcourse") {
    if (window.confirm("Supprimer ce cours de la liste ? Tes sessions déjà notées restent enregistrées.")) {
      data.courses = data.courses.filter((c) => c.name !== button.dataset.name);
      saveRevision();
    }
  }
  render();
  return true;
}

// Réglages modifiés (minimum par jour, objectif d'un cours). Renvoie true si c'est un réglage de révision.
function revisionChange(event) {
  if (gcalChange(event)) return true;
  const target = event.target;
  const data = state.revision;
  if (target.dataset.rev === "daily") {
    const value = parseInt(target.value, 10);
    if (value > 0) data.dailyMin = value;
  } else if (target.dataset.revGoal !== undefined) {
    const value = parseInt(target.value, 10);
    const course = data.courses.find((c) => c.name === target.dataset.revGoal);
    if (course && value >= 0) course.goal = value;
  } else return false;
  saveRevision();
  render();
  return true;
}

// reading.js : l'onglet Lecture (ce qui s'affiche et ce que font les boutons).
// Le calcul est dans calc.js ; l'anneau du jour et les barres des 7 jours viennent de revision.js (todayBlock, weekBlock).

const READ_QUICK_MINUTES = [15, 20, 30, 45, 60];
const COVERS = [
  ["#1E7B4B", "#FFFFFF"],
  ["#D9CDB8", "#1B2430"],
  ["#1B2430", "#FFFFFF"],
  ["#E0701A", "#1B2430"],
];

function loadReading() {
  const fresh = JSON.parse(JSON.stringify(CG.DEFAULT_READING));
  return Object.assign(fresh, read(STORE.reading, {}));
}

function saveReading() {
  write(STORE.reading, state.reading);
}

function coverColors(book) {
  return COVERS[Math.abs(Number(book.id)) % COVERS.length];
}

function currentBooks() {
  return state.reading.books.filter((b) => b.status === "reading");
}

// Prépare les formulaires « Noter ma lecture » et « Ajouter un livre » s'ils n'existent pas encore.
function ensureReadingForms(today) {
  const reading = currentBooks();
  if (!state.readLog) state.readLog = { bookId: null, minutes: 20, date: CG.toIso(today), page: "" };
  if (!state.bookDraft) state.bookDraft = { title: "", pages: "" };
  if (!reading.some((b) => b.id === state.readLog.bookId)) state.readLog.bookId = reading.length ? reading[0].id : null;
}

/* ---------- Les blocs de l'écran ---------- */

function readingView(today) {
  const k = CG.readingIndicators(state.reading, today);
  ensureReadingForms(today);
  return [readingHeader(today), todayBlock(k, "lecture"), weekBlock(k, "lecture"), readLogBlock(k, today), libraryBlock(k), readingIndicatorsBlock(k), readingSettings()].join("");
}

function readingHeader(today) {
  return `<header><div class="mois">${esc(longDate(CG.toIso(today)))}</div><h1>Lecture</h1></header>`;
}

function readLogBlock(k, today) {
  const log = state.readLog;
  const reading = currentBooks();
  const todayIso = CG.toIso(today);
  const book = reading.find((b) => b.id === log.bookId);
  const chips = reading.map((b) => `<button type="button" class="puce" data-action="bookchoose" data-id="${b.id}" aria-pressed="${log.bookId === b.id}">${esc(b.title)}</button>`).join("");
  const quick = READ_QUICK_MINUTES.map((m) => `<button type="button" class="puce petite" data-action="rdsetmin" data-value="${m}" aria-pressed="${log.minutes === m}">${CG.duration(m)}</button>`).join("");
  let lines = "";
  if (log.date === todayIso) {
    const after = k.todayMinutes + log.minutes;
    const reached = after >= k.dailyMin;
    lines = `<div class="${reached ? "bon" : "petit"}">Avec cette lecture : ${CG.duration(after)} aujourd'hui, ${reached ? "objectif atteint." : "encore " + CG.duration(k.dailyMin - after) + "."}</div>`;
  }
  return `
  <section class="carte">
    <h2>Noter ma lecture</h2>
    ${
      reading.length
        ? `<div class="puces" role="group" aria-label="Livre">${chips}</div>`
        : `<div class="petit">Aucun livre en cours : ta lecture sera notée sans livre. Ajoute un livre dans « Ma bibliothèque » pour suivre ta progression.</div>`
    }
    <div class="duree">
      <button type="button" class="rond clair" data-action="rdmin" data-delta="-5" aria-label="Retirer 5 minutes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
      <div class="gros-moyen">${CG.duration(log.minutes)}</div>
      <button type="button" class="rond" data-action="rdmin" data-delta="5" aria-label="Ajouter 5 minutes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <div class="puces centree" role="group" aria-label="Durées rapides">${quick}</div>
    ${book ? `<label class="champ">Page atteinte (facultatif, pour calculer ta vitesse)<input id="rl-page" type="text" inputmode="numeric" placeholder="Page ${book.page} actuellement" value="${esc(log.page)}"></label>` : ""}
    <label class="champ">Date<input id="rl-date" type="date" max="${todayIso}" value="${esc(log.date)}"></label>
    ${lines ? `<div class="consequence">${lines}</div>` : ""}
    ${state.readMessage ? `<div class="message">${esc(state.readMessage)}</div>` : ""}
    <button type="button" class="bouton" data-action="rdsave">Enregistrer</button>
    ${state.readConfirmation ? `<div class="confirmation">${esc(state.readConfirmation)}</div>` : ""}
  </section>`;
}

function libraryBlock(k) {
  const done = k.books.filter((b) => b.status === "done");
  const reading = k.books.filter((b) => b.status === "reading");
  const shelf = done
    .slice(-4)
    .reverse()
    .map((b) => {
      const [background, color] = coverColors(b);
      return `<div class="tuile"><div class="couv" style="background:${background};color:${color}">${esc(b.title)}</div><button type="button" class="supprimer" data-action="bookdel" data-id="${b.id}" aria-label="Supprimer ${esc(b.title)}">Supprimer</button></div>`;
    })
    .join("");
  const rows = reading
    .map((b) => {
      const [background] = coverColors(b);
      const forecast =
        b.timeLeft !== null
          ? `<div class="petit">Reste environ ${CG.duration(b.timeLeft)} de lecture${b.daysToFinish !== null ? ", soit " + b.daysToFinish + " jour" + (b.daysToFinish > 1 ? "s" : "") + " à ton rythme" : ""}.</div>`
          : `<div class="petit">Note la page atteinte pour voir le temps restant.</div>`;
      return `
      <div class="livre-en-cours">
        <div class="mini-couv" aria-hidden="true" style="background:${background}"></div>
        <div class="livre-infos">
          <div class="ligne base"><strong>${esc(b.title)}</strong><span class="petit">En cours</span></div>
          <div class="piste fine" role="img" aria-label="${Math.round(b.percent)} % du livre lu"><div class="remplissage" style="width:${Math.min(100, Math.round(b.percent))}%"></div></div>
          <div class="petit">Page ${b.page} sur ${b.pages}</div>
          ${forecast}
          <div class="actions-livre">
            <button type="button" class="lien" data-action="bookfinish" data-id="${b.id}">Marquer comme terminé</button>
            <button type="button" class="supprimer" data-action="bookdel" data-id="${b.id}" aria-label="Supprimer ${esc(b.title)}">Supprimer</button>
          </div>
        </div>
      </div>`;
    })
    .join("");
  const draft = state.bookDraft;
  return `
  <section class="carte">
    <div class="ligne base"><h2>Ma bibliothèque</h2><span class="petit">${k.booksRead} livre${k.booksRead > 1 ? "s" : ""} lu${k.booksRead > 1 ? "s" : ""}</span></div>
    ${shelf ? `<div class="etagere">${shelf}</div>` : ""}
    ${rows}
    ${!shelf && !rows ? `<div class="petit">Ta bibliothèque est vide. Ajoute le livre que tu lis en ce moment.</div>` : ""}
    <div class="consequence">
      <h2>Ajouter un livre</h2>
      <label class="champ">Titre<input id="b-title" type="text" value="${esc(draft.title)}" placeholder="Les Heures bleues" autocomplete="off"></label>
      <label class="champ">Nombre de pages<input id="b-pages" type="text" inputmode="numeric" value="${esc(draft.pages)}" placeholder="320"></label>
      <button type="button" class="bouton clair" data-action="bookadd">Ajouter ce livre</button>
      ${state.bookMessage ? `<div class="message">${esc(state.bookMessage)}</div>` : ""}

// Recopie ce qui est tapé dans les champs avant de redessiner l'écran.
function syncReadingForms() {
  const fields = { "rl-date": ["readLog", "date"], "rl-page": ["readLog", "page"], "b-title": ["bookDraft", "title"], "b-pages": ["bookDraft", "pages"] };
  Object.keys(fields).forEach((id) => {
    const element = document.getElementById(id);
    const [object, key] = fields[id];
    if (element && state[object]) state[object][key] = element.value;
  });
}

// Renvoie true si l'action concerne la lecture (et a été traitée).
function readingClick(action, button) {
  const actions = ["bookchoose", "rdmin", "rdsetmin", "rdsave", "bookadd", "bookfinish", "bookdel"];
  if (!actions.includes(action)) return false;
  syncReadingForms();
  state.readMessage = "";
  state.readConfirmation = "";
  state.bookMessage = "";
  const data = state.reading;
  const log = state.readLog;

  if (action === "bookchoose") log.bookId = Number(button.dataset.id);
  else if (action === "rdmin") log.minutes = Math.min(600, Math.max(5, log.minutes + Number(button.dataset.delta)));
  else if (action === "rdsetmin") log.minutes = Number(button.dataset.value);
  else if (action === "rdsave") {
    if (!log.date) state.readMessage = "Choisis une date.";
    else {
      const book = data.books.find((b) => b.id === log.bookId);
      let pagesRead = 0;
      const target = parseInt(log.page, 10);
      if (book && target > book.page) {
        pagesRead = target - book.page;
        book.page = Math.min(book.pages, target);
        if (book.page >= book.pages) book.status = "done";
      }
      data.sessions.push({ id: Date.now(), bookId: book ? book.id : null, minutes: log.minutes, date: log.date, pages: pagesRead });
      log.page = "";
      saveReading();
      state.readConfirmation = "Lecture enregistrée." + (book && book.status === "done" ? " Livre terminé, bravo !" : "");
    }
  } else if (action === "bookadd") {
    const title = state.bookDraft.title.trim();
    const pages = parseInt(state.bookDraft.pages, 10);
    if (!title) state.bookMessage = "Entre le titre du livre.";
    else if (!(pages > 0)) state.bookMessage = "Entre le nombre de pages.";
    else {
      data.books.push({ id: Date.now(), title, pages, page: 0, status: "reading" });
      state.bookDraft = { title: "", pages: "" };
      saveReading();
    }
  } else if (action === "bookfinish") {
    const book = data.books.find((b) => String(b.id) === button.dataset.id);
    if (book) {
      book.status = "done";
      book.page = book.pages;
      saveReading();
    }
  } else if (action === "bookdel") {
    if (window.confirm("Supprimer ce livre ? Tes sessions déjà notées restent enregistrées.")) {
      data.books = data.books.filter((b) => String(b.id) !== button.dataset.id);
      saveReading();
    }
  }
  render();
  return true;
}

// Réglage modifié (minimum par jour). Renvoie true si c'est un réglage de lecture.
function readingChange(event) {
  if (event.target.dataset.read !== "daily") return false;
  const value = parseInt(event.target.value, 10);
  if (value > 0) {
    state.reading.dailyMin = value;
    saveReading();
  }
  render();
  return true;
}

// gcal.js : lecture seule de Google Agenda (les DS à venir). Rien n'est écrit dans ton agenda.
// L'identifiant client Google se colle une fois dans « Mes cours et objectifs » ; il reste dans ce navigateur.

const GCAL_STORE = "cg.gcal";

function gcalClientId() {
  const saved = read(GCAL_STORE, {});
  return saved && saved.clientId ? saved.clientId : "";
}

function loadGoogleScript() {
  return new Promise((resolve, reject) => {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) return resolve();
    const script = document.createElement("script");
    script.src = "https://accounts.google.com/gsi/client";
    script.onload = () => resolve();
    script.onerror = () => reject(new Error("Impossible de charger Google. Vérifie ta connexion."));
    document.head.appendChild(script);
  });
}

function setGcalMessage(text) {
  state.gcalMessage = text;
  render();
}

async function syncGoogleCalendar() {
  const clientId = gcalClientId();
  if (!clientId) {
    state.gcalMessage = "Colle d'abord ton identifiant client Google dans « Mes cours et objectifs » (en bas de l'écran).";
    return;
  }
  state.gcalMessage = "Connexion à Google…";
  try {
    await loadGoogleScript();
    const token = await new Promise((resolve, reject) => {
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: "https://www.googleapis.com/auth/calendar.readonly",
        callback: (response) => (response.access_token ? resolve(response.access_token) : reject(new Error(response.error || "Autorisation refusée."))),
        error_callback: () => reject(new Error("Autorisation annulée.")),
      });
      client.requestAccessToken();
    });
    const now = new Date();
    const limit = new Date(now.getTime() + 180 * 86400000);
    const url =
      "https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=250" +
      "&timeMin=" + encodeURIComponent(now.toISOString()) + "&timeMax=" + encodeURIComponent(limit.toISOString());
    const response = await fetch(url, { headers: { Authorization: "Bearer " + token } });
    if (!response.ok) throw new Error("Google a refusé la lecture de l'agenda (code " + response.status + ").");
    const events = (await response.json()).items || [];
    const found = CG.examsFromEvents(events, state.revision.courses);
    const manual = state.revision.exams.filter((e) => !e.gcalId);
    state.revision.exams = manual.concat(found);
    saveRevision();
    setGcalMessage(found.length ? found.length + " DS lu" + (found.length > 1 ? "s" : "") + " dans ton agenda." : "Aucun DS trouvé dans les 6 prochains mois (couleur rouge tomate ou titre avec DS, contrôle, partiel…).");
  } catch (error) {
    setGcalMessage(error.message || "La lecture de Google Agenda a échoué.");
  }
}

function gcalSettings() {
  return `
  <label class="champ">Identifiant client Google (pour lire tes DS)<input type="text" data-gcal="clientid" autocomplete="off" placeholder="xxxx.apps.googleusercontent.com" value="${esc(gcalClientId())}"></label>`;
}

// Renvoie true si le champ modifié est l'identifiant client Google.
function gcalChange(event) {
  if (event.target.dataset.gcal !== "clientid") return false;
  write(GCAL_STORE, { clientId: event.target.value.trim() });
  render();
  return true;
}

// Le calcul est dans calc.js (objet CG) ; ici on ne fait qu'afficher et enregistrer.

const STORE = { budgets: "cg.budgets", expenses: "cg.expenses", revision: "cg.revision", reading: "cg.reading" };

// Les données sont gardées dans le navigateur (localStorage). Si c'est bloqué, l'appli marche quand même.
function read(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch (error) {
    return fallback;
  }
}

function write(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (error) {
    /* pas de sauvegarde possible : on continue sans */
  }
}

const state = {
  budgets: Object.assign({}, CG.DEFAULT_BUDGETS, read(STORE.budgets, {})),
  expenses: read(STORE.expenses, []),
  revision: loadRevision(), // défini dans revision.js
  reading: loadReading(), // défini dans reading.js
  tab: "accueil", // onglet affiché : "budget", "revision" ou "lecture"
  log: null, // formulaire « Noter ma session »
  examDraft: null, // formulaire « Ajouter un DS »
  revMessage: "",
  revConfirmation: "",
  examMessage: "",
  gcalMessage: "",
  sentence: "",
  draft: null, // la dépense en cours de validation
  message: "",
  confirmation: "",

};

/* ---------- Petits outils d'affichage ---------- */

function esc(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function euros(n) {
  const rounded = Math.round(n * 100) / 100;
  const text = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2);
  return text.replace(".", ",") + " €";
}

function signed(n) {
  const rounded = Math.round(n * 100) / 100;
  return (rounded >= 0 ? "+" : "−") + euros(Math.abs(rounded));
}

function dayLabel(iso, today) {
  const diff = Math.round((CG.fromIso(CG.toIso(today)) - CG.fromIso(iso)) / 86400000);
  if (diff === 0) return "aujourd'hui";
  if (diff === 1) return "hier";
  return new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" }).format(CG.fromIso(iso));
}

  const tabs = [
    { id: "accueil", label: "Accueil", icon: '<path d="M4 11.5 12 4l8 7.5V20H4z M10 20v-5h4v5"></path>' },
    { id: "budget", label: "Budget", icon: '<path d="M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M3 7l12-3v3 M16 14h2"></path>' },
    { id: "revision", label: "Révision", icon: '<path d="M2.5 9 12 4.5 21.5 9 12 13.5z M6.5 11.2v4.3c0 1.4 2.5 2.9 5.5 2.9s5.5-1.5 5.5-2.9v-4.3 M21.5 9v5.5"></path>' },
    { id: "lecture", label: "Lecture", icon: '<path d="M4 5h6a3 3 0 0 1 2 1v14a3 3 0 0 0-2-1H4z M20 5h-6a3 3 0 0 0-2 1v14a3 3 0 0 1 2-1h6z"></path>' },
  ];
  const buttons = tabs
    .map((tab) => {
      const active = state.tab === tab.id;
      const icon = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${tab.icon}</svg>`;
      return `<button type="button" class="onglet ${active ? "actif" : ""}" data-action="tab" data-tab="${tab.id}" ${active ? 'aria-current="page"' : `aria-label="${tab.label}"`}>${icon}${active ? tab.label : ""}</button>`;
    })
    .join("");
  return `<nav class="barre" aria-label="Navigation principale">${buttons}</nav>`;
}

// Le contenu d'une rubrique (sert à l'écran et à la page voisine pendant le glissement).
function pageContent(tab, today) {
  const k = CG.indicators(state.budgets, state.expenses, today);
  return tab === "accueil"
    ? homeView(today)
    : tab === "revision"
    ? revisionView(today)
    : tab === "lecture"
    ? readingView(today)
    : [headerBlock(today), summaryBlock(k), categoriesBlock(k), addBlock(), draftBlock(k, today), indicatorsBlock(k), lastExpensesBlock(today), settingsBlock()].join("");
}

// Remplace l'affichage des champs date par un cadre à nous (le vrai champ reste dessous, invisible).
function enhanceDates(root) {
  const format = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  root.querySelectorAll('input[type="date"]').forEach((input) => {
    const wrap = document.createElement("span");
    wrap.className = "date-wrap";
    const show = document.createElement("span");
    show.className = "date-affiche";
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(show);
    wrap.appendChild(input);
    const update = () => { show.textContent = input.value ? format.format(CG.fromIso(input.value)) : "Choisir une date"; };
    update();
    input.addEventListener("input", update);
    input.addEventListener("change", update);
  });
}

function render() {
  const today = new Date();
  const slide = state.slide ? " glisse-" + state.slide : "";
  state.slide = "";
  app.innerHTML = `<div class="page${slide}">${pageContent(state.tab, today)}</div>` + navBlock().replace('class="barre"', `class="barre${slide ? " anime" : ""}"`);
  enhanceDates(app);
}

/* ---------- Glisser d'une rubrique à l'autre ---------- */

const TAB_ORDER = ["accueil", "budget", "revision", "lecture"];

// Change de rubrique (boutons de la barre) : la page glisse depuis le côté d'où l'on vient.
function goToTab(id) {
  const from = TAB_ORDER.indexOf(state.tab);
  const to = TAB_ORDER.indexOf(id);
  if (to < 0 || to === from) return;
  state.slide = to > from ? "droite" : "gauche";
  state.tab = id;
  window.scrollTo(0, 0);
  render();
}

function goNextTab(step) {
  const next = TAB_ORDER.indexOf(state.tab) + step;
  if (next >= 0 && next < TAB_ORDER.length) goToTab(TAB_ORDER[next]);
}

document.addEventListener("keydown", (event) => {
  if (/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
  if (event.key === "ArrowRight") goNextTab(1);
  else if (event.key === "ArrowLeft") goNextTab(-1);
});

// Glisser au doigt comme sur Instagram : la page suit le doigt, la voisine arrive à côté.
let drag = null;

function makeNeighbor(tab) {
  const el = document.createElement("div");
  el.className = "page voisine";
  el.setAttribute("aria-hidden", "true");
  el.innerHTML = pageContent(tab, new Date());
  enhanceDates(el);
  el.style.top = 52 + window.scrollY + "px";
  app.appendChild(el);
  return el;
}

function applyDrag(dx) {
  const d = drag;
  if ((dx < 0 && !d.next) || (dx > 0 && !d.prev)) dx *= 0.3; // résistance au bout
  d.shown = dx;
  d.page.style.transform = `translateX(${dx}px)`;
  if (d.prev) d.prev.style.transform = `translateX(${dx - d.width}px)`;
  if (d.next) d.next.style.transform = `translateX(${dx + d.width}px)`;
}

document.addEventListener("pointerdown", (e) => {
  if (drag && drag.animating) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (e.target.closest && e.target.closest("input, textarea, select, .barre")) return;
  drag = { id: e.pointerId, type: e.pointerType, x: e.clientX, y: e.clientY, mode: null, px: e.clientX, pt: Date.now(), vx: 0, shown: 0 };
});

document.addEventListener("pointermove", (e) => {
  const d = drag;
  if (!d || d.animating || e.pointerId !== d.id) return;
  const dx = e.clientX - d.x;
  const dy = e.clientY - d.y;
  if (!d.mode) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (Math.abs(dx) <= Math.abs(dy) * 1.3) { drag = null; return; }
    const i = TAB_ORDER.indexOf(state.tab);
    d.mode = "h";
    d.page = app.querySelector(".page");
    d.width = app.clientWidth;
    d.prev = i > 0 ? makeNeighbor(TAB_ORDER[i - 1]) : null;
    d.next = i < TAB_ORDER.length - 1 ? makeNeighbor(TAB_ORDER[i + 1]) : null;
    document.body.classList.add("glisse");
  }
  const now = Date.now();
  if (now > d.pt) d.vx = (e.clientX - d.px) / (now - d.pt);
  d.px = e.clientX;
  d.pt = now;
  applyDrag(dx);
});

function endDrag(e, cancelled) {
  const d = drag;
  if (!d || e.pointerId !== d.id) return;
  if (d.mode !== "h") { drag = null; return; }
  const i = TAB_ORDER.indexOf(state.tab);
  let side = 0; // +1 : rubrique suivante, -1 : précédente
  if (!cancelled) {
    if ((d.shown < -d.width * 0.33 || d.vx < -0.5) && d.next) side = 1;
    else if ((d.shown > d.width * 0.33 || d.vx > 0.5) && d.prev) side = -1;
  }
  d.animating = true;
  [d.page, d.prev, d.next].forEach((el) => el && el.classList.add("suit"));
  applyDrag(-side * d.width);
  if (d.type === "mouse") {
    const stop = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
    document.addEventListener("click", stop, true);
    setTimeout(() => document.removeEventListener("click", stop, true), 60);
  }
  setTimeout(() => {
    document.body.classList.remove("glisse");
    drag = null;
    if (side) {
      state.tab = TAB_ORDER[i + side];
      state.slide = "fin";
      window.scrollTo(0, 0);
    }
    render();
  }, 290);
}
document.addEventListener("pointerup", (e) => endDrag(e, false));
document.addEventListener("pointercancel", (e) => endDrag(e, true));

/* ---------- Ce qui se passe quand je touche un bouton ---------- */

function startDraft(parsed) {
  state.draft = {
    amount: parsed && parsed.amount != null ? String(parsed.amount).replace(".", ",") : "",
    category: parsed ? parsed.category : "Autres",
    date: parsed ? parsed.date : CG.toIso(new Date()),
    note: parsed ? parsed.note : "",
  };
}

function readSentence() {
  state.confirmation = "";
  if (!state.sentence.trim()) {
    state.message = "Écris ou dicte une dépense, par exemple : 12 euros courses hier.";
    render();
    return;
  }
  const parsed = CG.parseExpense(state.sentence);
  startDraft(parsed);
  state.message = parsed.amount == null ? "Je n'ai pas trouvé le montant, complète-le ci-dessous." : "";
  render();
}

// Recopie ce qui est tapé dans les champs de vérification avant de redessiner l'écran.
function syncDraft() {
  if (!state.draft) return;
  const amount = document.getElementById("d-amount");
  const date = document.getElementById("d-date");
  const note = document.getElementById("d-note");
  if (amount) state.draft.amount = amount.value;
  if (date) state.draft.date = date.value;
  if (note) state.draft.note = note.value;
}

function startVoice() {
  if (!Recognition || state.listening) return;
  const recognition = new Recognition();
  recognition.lang = "fr-FR";
  recognition.interimResults = false;
  recognition.onresult = (event) => {
    state.sentence = event.results[0][0].transcript;
    readSentence();
  };
  recognition.onerror = () => {
    state.message = "La dictée n'a pas marché. Écris ta dépense à la place.";
  };
  recognition.onend = () => {
    state.listening = false;
    render();
  };
  try {
    recognition.start();
    state.listening = true;
    state.message = "";
    render();
  } catch (error) {
    state.message = "La dictée n'a pas marché. Écris ta dépense à la place.";
    render();
  }
}

function saveExpense() {
  syncDraft();
  const amount = parseFloat(String(state.draft.amount).replace(",", "."));
  if (!(amount > 0)) {
    state.message = "Entre un montant supérieur à 0.";
    render();
    return;
  }
  if (!state.draft.date) {
    state.message = "Choisis une date.";
    render();
    return;
  }
  state.expenses.push({
    id: Date.now(),
    amount: Math.round(amount * 100) / 100,
    category: state.draft.category,
    date: state.draft.date,
    note: state.draft.note.trim(),
  });
  write(STORE.expenses, state.expenses);
  state.draft = null;
  state.sentence = "";
  state.message = "";
  state.confirmation = "Dépense enregistrée.";
  render();
}

function exportData() {
  const data = JSON.stringify({ budgets: state.budgets, expenses: state.expenses, revision: state.revision, reading: state.reading }, null, 2);
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
  link.download = "mes-depenses-" + CG.toIso(new Date()) + ".json";
  link.click();
}

app.addEventListener("click", (event) => {
  const button = event.target.closest("[data-action]");
  if (!button) return;
  const action = button.dataset.action;
  if (readingClick(action, button)) return; // boutons de l'onglet Lecture (reading.js)
  if (revisionClick(action, button)) return; // boutons de l'onglet Révision (revision.js)
  if (action === "tab") {
    goToTab(button.dataset.tab);
  } else if (action === "voice") startVoice();
  else if (action === "read") readSentence();
  else if (action === "manual") {
    state.confirmation = "";
    state.message = "";
    startDraft(null);
    render();
  } else if (action === "cat") {
    syncDraft();
    state.draft.category = button.dataset.cat;
    render();
  } else if (action === "save") saveExpense();
  else if (action === "cancel") {
    state.draft = null;
    state.message = "";
    render();
  } else if (action === "delete") {
    if (window.confirm("Supprimer cette dépense ?")) {
      state.expenses = state.expenses.filter((e) => String(e.id) !== button.dataset.id);
      write(STORE.expenses, state.expenses);
      render();
    }
  } else if (action === "export") exportData();
});

app.addEventListener("input", (event) => {
  if (event.target.id === "sentence") state.sentence = event.target.value;
});

app.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && event.target.id === "sentence") readSentence();
});

// Garde la section « Mes budgets » ouverte quand l'écran est redessiné.
app.addEventListener("toggle", (event) => {
  if (event.target.tagName === "DETAILS") state.settingsOpen = event.target.open;
}, true);

app.addEventListener("change", (event) => {
  if (readingChange(event)) return;
  if (revisionChange(event)) return; // réglages de l'onglet Révision (revision.js)
  const name = event.target.dataset.budget;
  if (!name) return;
  const value = parseFloat(event.target.value.replace(",", "."));
  if (value >= 0) {
    state.budgets[name] = value;
    write(STORE.budgets, state.budgets);
  }
  render();
});

render();

</script>
