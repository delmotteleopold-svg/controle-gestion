<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon outil de contrôle de gestion</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #F2ECE1;
    color: #1B2430;
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
  }
  .carte {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 28px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 1px 2px rgba(27, 36, 48, 0.06);
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -0.5px; }
  p { margin: 0; color: #5B6572; font-size: 15px; }
  .pastille {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 12px;
    border-radius: 12px;
    background: #E1F2E8;
    color: #14573A;
    font-size: 13px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <main class="carte">
    <h1>Mon outil de contrôle de gestion</h1>
    <p>Étape 1 : la première page s'affiche dans le navigateur.</p>
    <span class="pastille">Environnement prêt</span>
  </main>
</body>
</html>
