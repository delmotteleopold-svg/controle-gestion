<!-- Modèle d'e-mail « Magic link » ET « Confirm signup » de Supabase (Authentication › Emails).
     Objet : « Ton code de connexion Salle & Assiette ». Applicable seulement avec un service SMTP personnel.
     {{ .Token }} = code à 6 chiffres saisi dans l'appli (pas de lien : sur iPhone, un lien s'ouvrirait dans Safari, hors de l'appli installée). -->
<div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:420px;margin:0 auto;padding:24px;background:#F5EFE5;border-radius:24px;color:#1C1A17">
  <h2 style="margin:0 0 8px">Ton code de connexion</h2>
  <p style="color:#6F685C;margin:0 0 18px">Saisis ce code dans l'appli pour te connecter :</p>
  <div style="font-size:34px;font-weight:800;letter-spacing:8px;background:#fff;border-radius:16px;padding:16px;text-align:center;color:#5B3DF5">{{ .Token }}</div>
  <p style="color:#6F685C;font-size:13px;margin:18px 0 0">Ce code expire dans 10 minutes. Si tu n'as rien demandé, ignore cet e-mail.</p>
  <p style="color:#6F685C;font-size:13px;margin:6px 0 0">— Salle &amp; Assiette</p>
</div>
