/* ================= État + stockage ================= */
const LS = "salle_assiette_v1";
const S = {config:null, foods:{}, recipes:{}, days:{}, sessions:{}};
const ui = {tab:"home", day:today(), prog:"charges", exSel:null, sync:"local"};
try{ const s = JSON.parse(localStorage.getItem(LS)||"null"); if(s) for(const k in S) if(s[k]) S[k]=s[k]; }catch(e){}
let saveT=null;
function saveLocal(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} },150); }

let db=null, sampler=null, dl=null;
const pending={}, inflight={};
function queue(path,val){ pending[path]={val}; if(!inflight[path]) flush(path); }
async function flush(path){
  inflight[path]=true;
  while(pending[path]){
    const {val}=pending[path]; delete pending[path];
    for(let attempt=0;attempt<2;attempt++){
      try{ const ref=db.doc(path); if(val==null) await ref.delete(); else await ref.set(val); break; }
      catch(e){
        if(e&&e.code==="unavailable"&&attempt===0){ await sleep(600+Math.random()*900); continue; }
        if(e&&e.code==="quota_exceeded") toast("Stockage plein : supprime d'anciennes données");
        else toast("Sauvegarde cloud impossible, gardée sur l'appareil");
        break;
      }
    }
  }
  inflight[path]=false;
}
function put(col,id,val){
  if(col==="config"){ S.config=val; }
  else { if(val==null) delete S[col][id]; else S[col][id]=val; }
  saveLocal();
  if(db) queue(col==="config"?"config/main":col+"/"+id, val==null?null:JSON.parse(JSON.stringify(val)));
  render();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));

async function initCloud(){
  if(!window.claude||!window.claude.use) return;
  try{ db = await window.claude.use("db"); }catch(e){ db=null; }
  try{ sampler = await window.claude.use("sample"); }catch(e){}
  try{ dl = await window.claude.use("downloads"); }catch(e){}
  render();
  if(!db) return;
  ui.sync="sync";
  const timer=setTimeout(()=>{ if(ui.sync==="sync"){ ui.sync="offline"; render(); } },10000);
  const got=new Set();
  const done=()=>{ if(got.size>=5){ clearTimeout(timer); ui.sync="cloud"; render(); } };
  const onErr=e=>{ clearTimeout(timer); ui.sync="offline"; render(); };
  for(const col of ["foods","recipes","days","sessions"]){
    db.collection(col).onSnapshot(snap=>{
      if(snap.empty && snap.metadata.fromCache && Object.keys(S[col]).length) return;
      const o={}; snap.docs.forEach(d=>{ o[d.id]=clone(d.data()); });
      // première synchro : pousser ce qui n'existe qu'en local
      if(!got.has(col) && !snap.metadata.fromCache){
        for(const id in S[col]) if(!(id in o)){ o[id]=S[col][id]; queue(col+"/"+id, clone(S[col][id])); }
      }
      S[col]=o; if(!snap.metadata.fromCache) got.add(col); saveLocal(); done(); softRender();
    }, onErr);
  }
  db.doc("config/main").onSnapshot(d=>{
    if(d.exists) S.config=clone(d.data());
    else if(!d.metadata.fromCache && S.config) queue("config/main", clone(S.config));
    if(!d.metadata.fromCache) got.add("config"); saveLocal(); done(); softRender();
  }, onErr);
}

/* ================= Utilitaires ================= */
function today(){ return new Date().toLocaleDateString("sv"); }
function dkey(d){ return d.toLocaleDateString("sv"); }
function addDays(k,n){ const d=new Date(k+"T12:00:00"); d.setDate(d.getDate()+n); return dkey(d); }
function fmtDay(k){ if(k===today()) return "Aujourd'hui"; if(k===addDays(today(),-1)) return "Hier"; return new Date(k+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}); }
function fmtShort(k){ return new Date(k+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); }
function num(v){ if(v==null) return NaN; return parseFloat(String(v).replace(",",".").replace(/[^0-9.\-]/g,"")); }
function r1(n){ return Math.round(n*10)/10; }
function fr(n,d=1){ return (Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toLocaleString("fr-FR"); }
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function cfg(){ const c=S.config||{}; return {goals:{...DEF_CONFIG.goals,...(c.goals||{})}, exercises:c.exercises||DEF_CONFIG.exercises, templates:c.templates||DEF_CONFIG.templates}; }
function exById(id){ return cfg().exercises.find(e=>e.id===id)||{id,name:"Exercice",target:10,inc:2.5}; }
function allFoods(){ const o={}; for(const k in DEF_FOODS) o[k]={...DEF_FOODS[k],builtin:true}; for(const k in S.foods) if(!S.foods[k].deleted) o[k]=S.foods[k]; else delete o[k]; return o; }
function dayOf(k){ return S.days[k]||{meals:[]}; }
function dayTotals(k){ const m=(dayOf(k).meals||[]); return {p:m.reduce((a,x)=>a+(+x.p||0),0), k:m.reduce((a,x)=>a+(+x.k||0),0)}; }
function weights(){ return Object.keys(S.days).filter(k=>S.days[k].weight).sort().map(k=>({d:k,y:S.days[k].weight})); }
function sessionsSorted(){ return Object.entries(S.sessions).map(([id,s])=>({id,...s})).sort((a,b)=>(b.start||0)-(a.start||0)); }
function activeSession(){ return sessionsSorted().find(s=>!s.done); }
function weekStart(){ const d=new Date(); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return dkey(d); }
function toast(t){
  const e=document.getElementById("toast"), warn=/invalide|impossible|requis|plein|non reconnu|Donne un nom/i.test(t);
  e.innerHTML=`<i class="dot" style="${warn?"background:var(--orange)":""}">${ic(warn?"warn":"check")}</i><span>${esc(t)}</span>`;
  clearTimeout(e._t); clearTimeout(e._t2); e.className=""; void e.offsetWidth; e.className="on";
  e._t=setTimeout(()=>{ e.className="off"; e._t2=setTimeout(()=>{ e.className=""; },350); },2400);
}

/* historique d'un exercice : [{d, top, sets}] (séances terminées) */
function exHistory(exId){
  const out=[];
  for(const s of sessionsSorted().slice().reverse()){
    if(!s.done) continue;
    const e=(s.ex||[]).find(x=>x.id===exId); if(!e) continue;
    const work=(e.sets||[]).filter(x=>!x.warm && x.done && +x.w>0);
    if(!work.length) continue;
    out.push({d:s.date, top:Math.max(...work.map(x=>+x.w)), sets:work, e1rm:Math.max(...work.map(x=>+x.w*(1+(+x.r||0)/30)))});
  }
  return out;
}
/* suggestion de charge pour la prochaine séance */
function suggest(exId){
  const ex=exById(exId), h=exHistory(exId); if(!h.length) return null;
  const last=h[h.length-1], ws=last.sets;
  const allHit = ws.length>=3 && ws.every(x=>(+x.r||0)>=ex.target);
  const w=Math.max(...ws.map(x=>+x.w));
  return allHit ? {w:r1(w+(+ex.inc||2.5)), up:true, last} : {w, up:false, last};
}

function ic(n,cls=""){ return `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IP[n]||""}</svg>`; }
const CHEV=ic("chevR","chev");
const GREEN="#14B866", ORANGE="#FF8A1C";

/* ================= Graphiques SVG ================= */
function lineChart(pts,{goal,color=GREEN,unit="",h=170}={}){
  if(pts.length<1) return `<div class="empty">Pas encore de données</div>`;
  const W=330,H=h,P={l:34,r:12,t:16,b:24};
  const xs=pts.map(p=>new Date(p.d+"T12:00:00").getTime());
  let ys=pts.map(p=>+p.y); const all=goal!=null?ys.concat([goal]):ys;
  let mn=Math.min(...all), mx=Math.max(...all); if(mn===mx){mn-=1;mx+=1;} const pad=(mx-mn)*.12; mn-=pad; mx+=pad;
  if(new Set(xs).size<xs.length){ for(let i=0;i<xs.length;i++) xs[i]=i; }
  const x0=Math.min(...xs), x1=Math.max(...xs)===x0?x0+1:Math.max(...xs);
  const X=t=>P.l+(t-x0)/(x1-x0)*(W-P.l-P.r), Y=v=>P.t+(mx-v)/(mx-mn)*(H-P.t-P.b);
  const d=pts.map((p,i)=>(i?"L":"M")+X(xs[i]).toFixed(1)+","+Y(ys[i]).toFixed(1)).join(" ");
  const area=d+` L${X(xs[xs.length-1]).toFixed(1)},${H-P.b} L${X(xs[0]).toFixed(1)},${H-P.b} Z`;
  let g=""; for(let i=0;i<=3;i++){ const v=mn+(mx-mn)*i/3; g+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${P.l-6}" y="${Y(v)+4}" font-size="10" text-anchor="end">${fr(v,(mx-mn)<8?1:0)}</text>`; }
  const gl = goal!=null?`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="${ORANGE}" stroke-dasharray="4 4" stroke-width="1.5" stroke-linecap="round"/><text x="${W-P.r}" y="${Y(goal)-6}" font-size="10" text-anchor="end" fill="${ORANGE}">objectif ${fr(goal)}${unit}</text>`:"";
  const n=pts.length, li=n-1;
  const dots=n<=40?pts.map((p,i)=>i===li?"":`<circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="2.6" fill="${color}" opacity=".55"/>`).join(""):"";
  const lastDot=`<circle cx="${X(xs[li])}" cy="${Y(ys[li])}" r="8" fill="${color}" opacity=".18"/><circle cx="${X(xs[li])}" cy="${Y(ys[li])}" r="4.5" fill="${color}" style="stroke:var(--card)" stroke-width="2"/>`;
  const lab=`<text class="ax" x="${P.l}" y="${H-6}" font-size="10">${fmtShort(pts[0].d)}</text><text class="ax" x="${W-P.r}" y="${H-6}" font-size="10" text-anchor="end">${fmtShort(pts[li].d)}</text>`;
  const gid="gr"+color.slice(1);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:8px"><defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}${gl}<path d="${area}" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lastDot}${lab}</svg>`;
}
function spark(vals,color=GREEN){
  if(vals.length<2) return "";
  const W=64,H=26,mn=Math.min(...vals),mx=Math.max(...vals)===mn?mn+1:Math.max(...vals);
  const d=vals.map((v,i)=>(i?"L":"M")+(i/(vals.length-1)*W).toFixed(1)+","+(H-3-(v-mn)/(mx-mn)*(H-6)).toFixed(1)).join(" ");
  return `<svg width="${W}" height="${H}" style="flex:none;overflow:visible"><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
/* anneaux concentriques façon Activité : protéines dehors, calories dedans */
function rings(p,pg,k,kg){
  const S2=152,c=S2/2,sw=17;
  const one=(R,v,goal,a,b,track,id)=>{ const pc=Math.min(1,goal?v/goal:0), C=2*Math.PI*R, off=C*(1-pc);
    return `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(${b})"/><stop offset="1" style="stop-color:var(${a})"/></linearGradient>
    <circle cx="${c}" cy="${c}" r="${R}" fill="none" style="stroke:var(${track})" stroke-width="${sw}"/>
    ${pc>0?`<circle class="rg" cx="${c}" cy="${c}" r="${R}" fill="none" stroke="url(#${id})" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" filter="url(#rgGlow)" opacity=".55" style="--c:${C.toFixed(2)}"/>
    <circle class="rg" cx="${c}" cy="${c}" r="${R}" fill="none" stroke="url(#${id})" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" style="--c:${C.toFixed(2)}"/>`:""}`; };
  return `<svg width="${S2}" height="${S2}" viewBox="0 0 ${S2} ${S2}" role="img" aria-label="Protéines ${fr(p,0)} sur ${pg} g, calories ${fr(k,0)} sur ${kg}"><defs><filter id="rgGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter></defs>
  <g transform="rotate(-90 ${c} ${c})">${one(c-sw/2-1,p,pg,"--green-a","--green-b","--track-g","rgP")}${one(c-sw*1.5-4,k,kg,"--orange-a","--orange-b","--track-o","rgK")}</g></svg>`;
}
function barsChart(days){
  const g=cfg().goals.prot, W=330,H=150,P={l:6,r:6,t:16,b:22}, n=days.length, bw=(W-P.l-P.r)/n;
  const mx=Math.max(g*1.25,...days.map(d=>d.p));
  const Y=v=>P.t+(1-v/mx)*(H-P.t-P.b);
  let s=""; days.forEach((d,i)=>{ const x=P.l+i*bw+bw*.2, w=bw*.6, y=Math.min(Y(d.p),H-P.b-4); s+=`<rect x="${x}" y="${y}" width="${w}" height="${H-P.b-y}" rx="${Math.min(5,w/2)}" fill="url(#${d.p>=g?"bgG":"bgO"})" opacity="${d.p?1:.22}"/>`; if(i%2===n%2||n<=7) s+=`<text class="ax" x="${x+w/2}" y="${H-7}" font-size="9" text-anchor="middle">${new Date(d.d+"T12:00:00").getDate()}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:8px"><defs><linearGradient id="bgG" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--green-a)"/><stop offset="1" style="stop-color:var(--green-b)"/></linearGradient><linearGradient id="bgO" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--orange-a)"/><stop offset="1" style="stop-color:var(--orange-b)"/></linearGradient></defs><line x1="0" x2="${W}" y1="${Y(g)}" y2="${Y(g)}" style="stroke:var(--mute)" stroke-dasharray="3 4" stroke-linecap="round" opacity=".6"/><text class="ax" x="${W-4}" y="${Y(g)-5}" font-size="10" text-anchor="end">${g} g</text>${s}</svg>`;
}

function exCard(s,e,ei){

    <button class="ok ${st.done?"on":""}" data-act="done" data-i="${ei}" data-j="${si}" aria-label="Valider la série">${ic("check")}</button></div>`}).join("")}

function buildEx(id){
  const ex=exById(id), sg=suggest(id);

}

function recipeTotals(r){

}

const AI_PROMPT=`Tu es un nutritionniste précis. Estime les protéines et les calories du repas décrit (portions françaises réalistes si les quantités manquent).
Réponds UNIQUEMENT avec un objet JSON valide, sans texte autour, de la forme :
{"nom":"nom court du plat en français","items":[{"nom":"aliment","grammes":nombre,"proteines":nombre,"kcal":nombre}],"proteines":nombre,"kcal":nombre,"confiance":"haute|moyenne|faible"}
"proteines" et "kcal" = totaux du repas entier.`;
function parseJSON(t){ if(typeof t!=="string") return t; const m=t.match(/\{[\s\S]*\}/); return JSON.parse(m?m[0]:t); }
async function askClaude(input,images){
  const opts={modelTier:"default"}; if(images) opts.images=images;
  try{ if(typeof sampler.json==="function") return parseJSON(await sampler.json(input,opts)); }catch(e){ if(e&&(e.code==="not_granted"||e.code==="rate_limited")) throw e; }
  const r=await sampler(input,opts); return parseJSON(r.text);
}

  sheet(`<div style="text-align:center;padding:30px 0"><span class="spin"></span><div class="sub" style="margin-top:12px">Claude analyse ton repas…</div></div>`);
  try{
    const r=await askClaude(input,images);

    if(!isFinite(p)||!isFinite(k)) throw new Error("bad");

    sheet(`<h2 style="margin-top:0">${esc(ui.aiRes.name)}</h2>${r.confiance?`<span class="tag ${r.confiance==="haute"?"":"o"}">confiance ${esc(r.confiance)}</span>`:""}

    <div class="grid2"><div><div class="lbl">Protéines (g)</div><input id="aip" inputmode="decimal" value="${fr(p,0)}"></div><div><div class="lbl">Calories</div><input id="aik" inputmode="decimal" value="${fr(k,0)}"></div></div>

    sheet(`<h2 style="margin-top:0">Oups</h2><div class="sub">${msg}</div><div style="height:12px"></div><button class="btn l w" data-act="manualMeal">Saisie manuelle</button>`);

}
async function shrink(file){
  const img=await createImageBitmap(file).catch(()=>null); if(!img) return file;
  const s=Math.min(1,1024/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.82));
}
document.getElementById("photo").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
  const b=await shrink(f); runAi(AI_PROMPT+"\n\nRepas : celui de la photo jointe.",[b]);
});

const LS_EXP="salle_assiette_export"; // date du dernier export, propre à l'appareil (confort, pas une donnée)
function lastExport(){ try{ return localStorage.getItem(LS_EXP); }catch(e){ return null; } }
function markExport(){ try{ localStorage.setItem(LS_EXP,today()); }catch(e){} }
function exportNote(){ const d=lastExport(); if(!d) return "Aucun export depuis cet appareil."; const n=Math.round((new Date(today())-new Date(d))/86400000); return "Dernier export : "+(n<=0?"aujourd'hui":n===1?"hier":"il y a "+n+" jours")+"."; }
const dec=v=>v===""||v==null||!isFinite(+v)?"":String(r1(+v)).replace(".",",");
function csv(rows){ const c=v=>{ v=v==null?"":String(v); return /[;"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }; return "\uFEFF"+rows.map(r=>r.map(c).join(";")).join("\r\n"); }
const CSV={
  seances:{t:"Séances",d:"Une ligne par série : charge, reps, validée",rows(){ const R=[["date","seance","heure_debut","duree_min","exercice","serie","type","charge_kg","reps","validee"]];
    for(const s of sessionsSorted().slice().reverse()){ if(!s.done) continue; const h=s.start?new Date(s.start).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"", du=s.end&&s.start?Math.round((s.end-s.start)/60000):"";
      for(const e of s.ex||[]){ let wi=0; for(const st of e.sets||[]) R.push([s.date,s.name,h,du,exById(e.id).name,st.warm?"É":++wi,st.warm?"échauffement":"travail",dec(st.w),st.r??"",st.done?"oui":"non"]); } } return R; }},
  poids:{t:"Pesées",d:"Date et poids",rows(){ return [["date","poids_kg"]].concat(weights().map(w=>[w.d,dec(w.y)])); }},
  repas:{t:"Repas",d:"Chaque aliment ou plat ajouté",rows(){ const R=[["date","heure","repas","quantite_g","proteines_g","kcal"]];
    for(const k of Object.keys(S.days).sort()) for(const m of S.days[k].meals||[]) R.push([k,m.t||"",m.name,m.g?Math.round(m.g):"",dec(m.p),Math.round(+m.k||0)]); return R; }},
  jours:{t:"Bilan par jour",d:"Protéines, calories, poids et séances",rows(){ const g=cfg().goals, R=[["date","proteines_g","kcal","objectif_proteines_atteint","poids_kg","seances"]];
    const n={}; for(const s of sessionsSorted()) if(s.done) n[s.date]=(n[s.date]||0)+1;
    const keys=[...new Set(Object.keys(S.days).concat(Object.keys(n)))].sort();
    for(const k of keys){ const t=dayTotals(k), d=dayOf(k); R.push([k,dec(t.p),Math.round(t.k),t.p>=g.prot?"oui":"non",dec(d.weight),n[k]||0]); } return R; }}
};
/* Ouvre l'enregistrement du fichier : version Claude (downloads) ou navigateur (lien de téléchargement). */
async function saveFile(filename,data,mime){
  if(dl){ try{ await dl.save({filename,data}); return "ok"; }catch(e){ if(e&&e.code==="declined") return "no"; } }
  if(!(window.claude&&window.claude.use)){ try{ const u=URL.createObjectURL(new Blob([data],{type:mime})), a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000); return "ok"; }catch(e){} }
  return "fail";
}

/* ================= Balayage entre onglets (façon iOS / Instagram) =================
   Suivi du doigt 1:1, verrouillage de l'axe, élastique iOS aux bords,
   changement de page au-delà de la moitié ou sur un coup de doigt rapide,
   puis arrivée qui prolonge la vitesse du geste. */
const TABS=["home","gym","food","prog"], VIEWS={home:viewHome,gym:viewGym,food:viewFood,prog:viewProg};
const SW={st:null};
function rubber(x,d){ return Math.sign(x)*(1-1/(Math.abs(x)*0.55/d+1))*d; } // formule de l'élastique iOS
function swipeBlocked(t){ return document.body.classList.contains("sheet")||!!(t.closest&&t.closest("input,textarea,select,.step,nav,#ov,#toast")); }
function peekHtml(tab){ const d=ui.day; if(tab==="food") ui.day=today(); const h=VIEWS[tab](); ui.day=d; return h; }
function navMark(tab){ document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===tab)); }
function swSet(off){ SW.off=off; SW.app.style.transform=`translate3d(${off}px,0,0)`; for(const p of SW.peeks) p.el.style.transform=`translate3d(${p.side*SW.W+off}px,0,0)`;
  const t=TABS[Math.max(0,Math.min(TABS.length-1,SW.idx+Math.round(-off/SW.W)))]; if(t!==SW.mark){ SW.mark=t; navMark(t); } }
function swBegin(){
  SW.st="drag"; SW.app=document.getElementById("app"); SW.W=window.innerWidth; SW.idx=TABS.indexOf(ui.tab); SW.mark=ui.tab; SW.peeks=[];
  SW.app.style.transition="none"; SW.app.style.willChange="transform"; document.body.classList.add("swiping");
  for(const side of [-1,1]){ const t=TABS[SW.idx+side]; if(!t) continue; const el=document.createElement("main"); el.className="peek"; el.setAttribute("aria-hidden","true"); el.innerHTML=peekHtml(t); el.style.transform=`translate3d(${side*SW.W}px,0,0)`; document.body.appendChild(el); SW.peeks.push({side,el}); }
}
function swEnd(cancel){
  const now=performance.now(), s=SW.samples.filter(p=>now-p.t<100), a=s[0], b=s[s.length-1];
  const v=cancel||!a||b.t===a.t?0:(b.x-a.x)/(b.t-a.t); // px/ms
  let go=0;
  if(!cancel){ if(Math.abs(v)>0.3){ go=v<0?1:-1; if((go===1&&SW.off>0)||(go===-1&&SW.off<0)) go=0; } else if(Math.abs(SW.off)>SW.W/2) go=SW.off<0?1:-1; }
  if(!TABS[SW.idx+go]) go=0;
  const target=-go*SW.W, rest=Math.abs(target-SW.off);
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur=reduce?0:Math.round(Math.min(380,Math.max(200,rest/Math.max(Math.abs(v),0.9)*1.6)));
  const tr=`transform ${dur}ms cubic-bezier(.2,.9,.3,1)`;
  SW.app.style.transition=tr; for(const p of SW.peeks) p.el.style.transition=tr;
  SW.st="settle"; swSet(target); if(!go) navMark(ui.tab);
  setTimeout(()=>swFinish(go),dur+16);
}
function swFinish(go){
  const app=SW.app;
  if(go){ ui.tab=TABS[SW.idx+go]; if(ui.tab==="food") ui.day=today(); ui.anim=false; render(); window.scrollTo(0,0); }
  app.style.transition="none"; app.style.transform=""; app.style.willChange=""; void app.offsetWidth; app.style.transition="";
  for(const p of SW.peeks) p.el.remove(); SW.peeks=[]; SW.st=null; document.body.classList.remove("swiping"); navMark(ui.tab);
}
document.addEventListener("touchstart",e=>{
  if(SW.st||e.touches.length!==1||swipeBlocked(e.target)) return;
  const t=e.touches[0]; SW.st="pending"; SW.x0=t.clientX; SW.y0=t.clientY; SW.samples=[{t:performance.now(),x:t.clientX}];
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!SW.st||SW.st==="settle") return;
  const t=e.touches[0], dx=t.clientX-SW.x0, dy=t.clientY-SW.y0;
  if(SW.st==="pending"){ if(Math.hypot(dx,dy)<10) return; if(Math.abs(dx)>Math.abs(dy)*1.15){ swBegin(); SW.x0=t.clientX-dx; } else { SW.st=null; return; } }
  e.preventDefault();
  const now=performance.now(); SW.samples.push({t:now,x:t.clientX}); while(SW.samples.length>2&&now-SW.samples[0].t>120) SW.samples.shift();
  const has=TABS[SW.idx+(dx<0?1:-1)];
  swSet(has?dx:rubber(dx,SW.W));
},{passive:false});
document.addEventListener("touchend",()=>{ if(SW.st==="drag"){ SW.blockClick=Date.now(); swEnd(false); } else if(SW.st==="pending") SW.st=null; },{passive:true});
document.addEventListener("touchcancel",()=>{ if(SW.st==="drag") swEnd(true); else if(SW.st==="pending") SW.st=null; },{passive:true});
